name: Build and Release WPF App

on:
  push:
    branches:
      - master
      - main

  workflow_dispatch:
    inputs:
      app_name:
        description: 'Optional application name to use for artifact/release'
        required: false
        default: 'SwissTimingDisplay'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app_name || 'SwissTimingDisplay' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch tags
      run: git fetch --tags

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Read project version
      id: version
      shell: pwsh
      run: |
        [xml]$proj = Get-Content "SwissTimingDisplay/SwissTimingDisplay.csproj"

        $version =
          $proj.Project.PropertyGroup.Version

        if (-not $version) {
          $version =
            $proj.Project.PropertyGroup.VersionPrefix
        }

        if (-not $version) {
          throw "No Version or VersionPrefix found in csproj"
        }

        Write-Host "Project Version: $version"
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Determine next release tag
      id: tag
      shell: pwsh
      run: |

        $baseVersion = "${{ steps.version.outputs.VERSION }}"

        $tags = git tag -l "v$baseVersion.*"

        if (-not $tags) {
          $nextPatch = 1
        }
        else {

          $highest = $tags |
            ForEach-Object {
              ($_ -split '\.')[-1]
            } |
            Measure-Object -Maximum |
            Select-Object -ExpandProperty Maximum

          $nextPatch = $highest + 1
        }

        $releaseTag = "v$baseVersion.$nextPatch"

        Write-Host "New release tag: $releaseTag"

        "RELEASE_TAG=$releaseTag" >> $env:GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish WPF App
      shell: pwsh
      run: |
        dotnet publish SwissTimingDisplay/SwissTimingDisplay.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          /p:PublishSingleFile=true `
          -o publish

    - name: Zip published output
      shell: pwsh
      run: |
        Compress-Archive `
          -Path publish\* `
          -DestinationPath "${{ env.APP_NAME }}-${{ steps.tag.outputs.RELEASE_TAG }}.zip"

    - name: Create git tag
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git tag "${{ steps.tag.outputs.RELEASE_TAG }}"
        git push origin "${{ steps.tag.outputs.RELEASE_TAG }}"

    - name: Upload published artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ steps.tag.outputs.RELEASE_TAG }}
        path: ${{ env.APP_NAME }}-${{ steps.tag.outputs.RELEASE_TAG }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        generate_release_notes: true
        files: ${{ env.APP_NAME }}-${{ steps.tag.outputs.RELEASE_TAG }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}